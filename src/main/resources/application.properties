spring.application.name=BibliotecaProyecto
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/biblioteca_digital}
spring.datasource.username=${DB_USER:biblioteca_proyecto_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=2
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB
spring.thymeleaf.cache=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
app.storage.path=${BOOK_STORAGE_PATH:storage}
app.admin.email=${LIBRARY_ADMIN_EMAIL:}
app.admin.password=${LIBRARY_ADMIN_PASSWORD:}
