<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogo | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="shell page"><div class="page-title"><div><h1>Catalogo de libros</h1><p th:text="${total} + ' titulos encontrados'">Titulos encontrados</p></div><a th:if="${usuario.rol == 'ADMIN'}" class="btn" th:href="@{/admin/libros/nuevo}">Agregar libro</a></div>
<form class="search" th:action="@{/libros}" method="get"><input name="q" th:value="${q}" placeholder="Busca por titulo, autor o genero" aria-label="Buscar libros"><button class="btn" type="submit">Buscar</button></form><div class="alert" th:if="${param.retirado}">Libro retirado del catalogo.</div>
<div class="grid" style="margin-top:20px" th:if="${!#lists.isEmpty(libros)}"><article class="book-card" th:each="libro : ${libros}"><div class="book-cover" th:classappend="${libro.id % 3 == 0 ? ' blue' : (libro.id % 3 == 1 ? ' coral' : ' gold')}"><i class="bi bi-book"></i></div><div class="book-body"><span class="eyebrow" th:text="${libro.genero}">Genero</span><h3 th:text="${libro.titulo}">Titulo</h3><p th:text="${libro.autor}">Autor</p><span class="pill" th:classappend="${libro.accesoMinimo == 'PREMIUM' ? ' premium' : ''}" th:text="${libro.accesoMinimo}">Plan</span><a th:href="@{/libros/{id}(id=${libro.id})}">Ver detalles</a></div></article></div><p class="empty" th:if="${#lists.isEmpty(libros)}">No encontramos libros con esa busqueda.</p>
<div class="page-actions"><a class="btn secondary" th:if="${pagina > 0}" th:href="@{/libros(q=${q},pagina=${pagina - 1})}">Anterior</a><a class="btn secondary" th:if="${(pagina + 1) * 20 < total}" th:href="@{/libros(q=${q},pagina=${pagina + 1})}">Siguiente</a></div></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
