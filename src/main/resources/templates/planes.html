<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Planes de lectura')}"></head><body><header th:replace="~{fragments :: cabecera}"></header><main id="contenido" class="shell page plans-page">
<div class="page-title"><div><span class="eyebrow">HAZ DE LA LECTURA UN HÁBITO</span><h1>Un plan para tu curiosidad.</h1><p th:text="'Tu plan actual es ' + ${suscripcion.planCodigo} + '. Consulta sus beneficios y vigencia.'"></p></div><a class="text-link" th:href="@{/mi-cuenta}">← Mi cuenta</a></div><div class="alert" role="status" th:if="${param.actualizado}">Plan actualizado.</div>
<dl class="subscription-dates"><div><dt>Fecha de inicio</dt><dd th:text="${#temporals.format(suscripcion.iniciaEn, 'dd/MM/yyyy HH:mm')}"></dd></div><div><dt>Fecha de terminación</dt><dd th:text="${#temporals.format(suscripcion.venceEn, 'dd/MM/yyyy HH:mm')}"></dd></div><div><dt>Estado</dt><dd><span class="pill" th:text="${suscripcion.vigente() ? 'Vigente' : 'No vigente'}"></span></dd></div></dl>
<div class="grid two plans-grid"><section class="panel plan-card" th:each="plan : ${planes}" th:classappend="${plan.codigo == 'PREMIUM' ? 'plan-premium' : ''}"><div class="plan-heading"><span class="eyebrow">TU EXPERIENCIA DE LECTURA</span><span aria-hidden="true" th:text="${plan.codigo == 'PREMIUM' ? '✳' : '✦'}"></span></div><h2 th:text="${plan.codigo == 'BASICO' ? 'Básico' : plan.nombre}"></h2><p th:text="${plan.catalogoCompleto ? 'Más posibilidades para seguir descubriendo.' : 'Un buen comienzo para tu próxima historia.'}"></p><ul class="list plan-benefits"><li><i class="bi bi-check" aria-hidden="true"></i><span th:text="${plan.maxPrestamos} + ' préstamos simultáneos'"></span></li><li><i class="bi bi-check" aria-hidden="true"></i><span th:text="${plan.diasPrestamo} + ' días por préstamo'"></span></li><li><i class="bi bi-check" aria-hidden="true"></i><span th:text="${plan.maxReservas} + ' reservas activas'"></span></li><li><i class="bi bi-check" aria-hidden="true"></i><span th:text="${plan.catalogoCompleto ? 'Catálogo completo' : 'Catálogo básico'}"></span></li></ul><form th:action="@{/planes}" method="post"><input th:replace="~{fragments :: csrf}"><input type="hidden" name="codigo" th:value="${plan.codigo}"><button class="btn" th:disabled="${suscripcion.planCodigo == plan.codigo && suscripcion.vigente()}" type="submit" th:text="${suscripcion.planCodigo == plan.codigo ? (suscripcion.vigente() ? 'Plan actual' : 'Renovar plan') : 'Seleccionar plan'}"></button></form></section></div>
</main><footer th:replace="~{fragments :: pie}"></footer></body></html>
