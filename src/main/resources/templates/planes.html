<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="shell page"><div class="page-title"><div><h1>Suscripcion</h1><p th:text="'Tu plan actual es ' + ${suscripcion.planCodigo} + '. Vigente hasta ' + ${suscripcion.venceEn}"></p></div></div><div class="alert" th:if="${param.actualizado}">Plan actualizado.</div><div class="grid two"><section class="panel" th:each="plan : ${planes}"><span class="eyebrow" th:text="${plan.codigo}"></span><h2 th:text="${plan.nombre}"></h2><ul class="list"><li th:text="${plan.maxPrestamos} + ' prestamos simultaneos'"></li><li th:text="${plan.diasPrestamo} + ' dias por prestamo'"></li><li th:text="${plan.maxReservas} + ' reservas activas'"></li><li th:text="${plan.catalogoCompleto ? 'Catalogo completo' : 'Catalogo basico'}"></li></ul><form th:action="@{/planes}" method="post" class="actions"><input th:replace="~{fragments :: csrf}"><input type="hidden" name="codigo" th:value="${plan.codigo}"><button class="btn" th:disabled="${suscripcion.planCodigo == plan.codigo}" type="submit" th:text="${suscripcion.planCodigo == plan.codigo ? 'Plan actual' : 'Seleccionar plan'}"></button></form></section></div></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
