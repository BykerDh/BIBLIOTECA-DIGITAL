<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234e40"><title th:text="${libro.titulo} + ' | Biblioteca UTS'">Biblioteca UTS · Lectura</title><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:if="${formato != 'PDF'}" type="module" th:src="@{/js/lector.js}"></script></head>
<body class="reader-page"><header class="reader-header"><a class="reader-brand" th:href="@{/}">Biblioteca UTS</a><a class="btn small secondary" th:href="@{/libros/{id}(id=${libro.id})}">← Volver al libro</a><div><h1 th:text="${libro.titulo}"></h1><span class="meta" th:text="${libro.autor} + ' · ' + ${formato}"></span></div><a class="btn small" th:href="@{/libros/{id}/archivo/{f}(id=${libro.id},f=${formato},modo='DESCARGA')}" th:text="'Descargar ' + ${formato}">Descargar</a></header>
<main class="reader-main"><iframe th:if="${formato == 'PDF'}" class="pdf-reader" title="Lectura PDF" th:src="@{/libros/{id}/archivo/PDF(id=${libro.id},modo='ONLINE')}"></iframe><th:block th:unless="${formato == 'PDF'}"><p id="lectura-estado" role="status">Preparando tu lectura…</p><foliate-view id="visor" th:attr="data-url=@{/libros/{id}/archivo/{f}(id=${libro.id},f=${formato},modo='ONLINE')},data-formato=${formato}"></foliate-view>
<nav class="reader-controls" aria-label="Controles de lectura"><button id="anterior" class="btn secondary" disabled>← Anterior</button><label>Capítulo <select id="capitulos" disabled><option>Cargando…</option></select></label><label>Texto <select id="tamano"><option value="100">Normal</option><option value="120">Grande</option><option value="140">Muy grande</option></select></label><label>Fondo <select id="tema"><option value="claro">Claro</option><option value="sepia">Sepia</option><option value="noche">Noche</option></select></label><span id="progreso" aria-live="polite"></span><button id="siguiente" class="btn secondary" disabled>Siguiente →</button></nav></th:block>
<p class="reader-help" th:if="${formato == 'PDF'}">Si tu dispositivo no muestra el PDF, usa «Descargar PDF» para abrirlo en su lector.</p></main></body></html>
