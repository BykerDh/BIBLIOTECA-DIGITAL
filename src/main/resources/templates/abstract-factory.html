<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Factory | Biblioteca Digital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/app">Biblioteca Digital</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mb-2">Patron Abstract Factory</h1>
            <p class="text-secondary">
                Selecciona un plan para crear su catalogo y sus reglas de prestamo.
            </p>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post" action="/app/abstract-factory">
                        <label for="plan" class="form-label">Plan de suscripcion</label>

                        <select id="plan" name="plan" class="form-select mb-3">
                            <option th:each="planItem : ${planes}"
                                    th:value="${planItem}"
                                    th:text="${planItem}">
                            </option>
                        </select>

                        <button type="submit" class="btn btn-success">
                            Crear configuracion del plan
                        </button>
                    </form>
                </div>
            </div>

            <div th:if="${resultado != null}" class="card shadow-sm border-0 mt-4">
                <div class="card-body p-4">
                    <h2 class="h4 text-success" th:text="'Plan ' + ${resultado.plan}"></h2>

                    <hr>

                    <h3 class="h5" th:text="${resultado.nombreCatalogo}"></h3>
                    <p th:text="${resultado.descripcionCatalogo}"></p>

                    <div class="row text-center mt-3">
                        <div class="col-md-6">
                            <div class="border rounded p-3">
                                <strong th:text="${resultado.diasPrestamo}"></strong>
                                <div class="text-secondary">Dias de prestamo</div>
                            </div>
                        </div>

                        <div class="col-md-6 mt-3 mt-md-0">
                            <div class="border rounded p-3">
                                <strong th:text="${resultado.maximoPrestamos}"></strong>
                                <div class="text-secondary">Prestamos simultaneos</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
