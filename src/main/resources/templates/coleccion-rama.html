<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<li th:fragment="rama(nodo)">
<a th:if="${nodo.esColeccion}" th:href="@{/colecciones/{id}/libros(id=${nodo.id})}"><i class="bi bi-collection" aria-hidden="true"></i><strong th:text="${nodo.nombre}"></strong><span aria-hidden="true">↗</span></a>
<a th:unless="${nodo.esColeccion}" th:href="@{/libros/{id}(id=${nodo.id})}"><i class="bi bi-book" aria-hidden="true"></i><span th:text="${nodo.nombre}"></span></a>
<ul th:if="${!#lists.isEmpty(nodo.hijos)}"><th:block th:each="hijo : ${nodo.hijos}"><li th:replace="~{coleccion-rama :: rama(${hijo})}"></li></th:block></ul>
</li></body></html>
