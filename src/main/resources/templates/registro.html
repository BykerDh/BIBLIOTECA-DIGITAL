<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<main class="auth"><div class="auth-card"><a class="brand" th:href="@{/login}"><span class="brand-mark">B</span><span>Biblioteca Digital</span></a><h1>Crea tu cuenta</h1><p>Tu cuenta inicia con el plan Basico.</p><div class="alert error" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/registrarse}" method="post"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" th:value="${nombre}" maxlength="120" required></div><div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" th:value="${email}" maxlength="190" required></div><div class="field"><label for="password">Contrasena</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required></div><button class="btn" type="submit">Crear cuenta</button></form>
<p class="bottom">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresa</a></p></div></main></body></html>
