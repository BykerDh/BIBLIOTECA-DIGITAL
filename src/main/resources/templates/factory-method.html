<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Factory Method</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <a href="/app" class="btn btn-outline-secondary mb-4">Volver</a>

        <div class="card p-4">
            <h1>Patrón Factory Method</h1>
            <p>
                Selecciona un formato de libro digital. El sistema creará automáticamente
                el lector correcto según el formato elegido.
            </p>

            <form method="post" action="/app/factory" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Título del libro</label>
                    <input type="text" name="titulo" class="form-control"
                           placeholder="Ejemplo: Patrones de Software"
                           th:value="${titulo}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Formato</label>
                    <select name="formato" class="form-select" required>
                        <option th:each="formato : ${formatos}"
                                th:value="${formato}"
                                th:text="${formato}"
                                th:selected="${formato == formatoSeleccionado}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Abrir libro</button>
            </form>

            <div class="alert alert-success mt-4" th:if="${resultado}">
                <strong>Resultado:</strong>
                <span th:text="${resultado}"></span>
            </div>
        </div>
    </main>
</body>
</html>
