<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Volvamos a la biblioteca')}"></head><body><main class="error-page"><section class="error-card"><a th:replace="~{fragments :: marca}"></a><span class="error-symbol" th:text="${status}">404</span><h1 th:text="${status == 404 ? 'Esta página no está en la estantería.' : (status == 403 ? 'Este espacio tiene acceso restringido.' : 'No pudimos abrir esta página.')}"></h1><p th:text="${status == 404 ? 'Puede que el enlace haya cambiado. Vuelve al catálogo para encontrar tu próxima lectura.' : (status == 403 ? 'Ingresa con una cuenta que tenga los permisos necesarios para continuar.' : 'Intenta nuevamente en unos instantes o vuelve al inicio de la biblioteca.')}"></p><div class="actions"><a class="btn" th:href="@{/}">Ir al inicio</a><a class="btn secondary" th:href="@{/libros}">Explorar catálogo</a></div></section></main></body></html>
