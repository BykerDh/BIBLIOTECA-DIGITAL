<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar libro | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="shell page"><div class="page-title"><div><h1 th:text="${libro == null ? 'Nuevo libro' : 'Editar libro'}"></h1><p>Informacion del catalogo y licencias digitales.</p></div><a class="btn secondary" th:href="@{/libros}">Catalogo</a></div><div class="alert" th:if="${param.guardado}">Libro guardado.</div><div class="alert" th:if="${param.archivo}">Archivo cargado.</div><div class="alert" th:if="${param.clonado}">Copia creada; agrega sus archivos.</div>
<form class="panel" th:action="@{/admin/libros/guardar}" method="post"><input th:replace="~{fragments :: csrf}"><input type="hidden" name="id" th:if="${libro != null}" th:value="${libro.id}"><div class="form-grid">
<div class="field"><label for="titulo">Titulo</label><input id="titulo" name="titulo" th:value="${libro?.titulo}" maxlength="250" required></div><div class="field"><label for="autor">Autor</label><input id="autor" name="autor" th:value="${libro?.autor}" maxlength="180" required></div>
<div class="field"><label for="genero">Genero</label><input id="genero" name="genero" th:value="${libro?.genero}" maxlength="100" required></div><div class="field"><label for="idioma">Idioma</label><input id="idioma" name="idioma" th:value="${libro == null ? 'es' : libro.idioma}" maxlength="30" required></div>
<div class="field"><label for="isbn">ISBN</label><input id="isbn" name="isbn" th:value="${libro?.isbn}" maxlength="20"></div><div class="field"><label for="editorial">Editorial</label><input id="editorial" name="editorial" th:value="${libro?.editorial}" maxlength="150"></div>
<div class="field"><label for="paginas">Paginas</label><input id="paginas" name="paginas" type="number" min="1" th:value="${libro?.paginas}"></div><div class="field"><label for="licencias">Licencias simultaneas</label><input id="licencias" name="licencias" type="number" min="1" th:value="${libro == null ? 1 : libro.licencias}" required></div>
<div class="field"><label for="accesoMinimo">Acceso minimo</label><select id="accesoMinimo" name="accesoMinimo"><option value="BASICO" th:selected="${libro == null || libro.accesoMinimo == 'BASICO'}">Basico</option><option value="PREMIUM" th:selected="${libro != null && libro.accesoMinimo == 'PREMIUM'}">Premium</option></select></div>
<div class="field full"><label for="descripcion">Descripcion</label><textarea id="descripcion" name="descripcion" maxlength="5000" required th:text="${libro?.descripcion}"></textarea></div></div><div class="actions"><button class="btn" type="submit">Guardar libro</button></div></form>
<div th:if="${libro != null}"><h2 class="section-title">Archivos digitales</h2><div class="panel"><ul class="list" th:if="${!#lists.isEmpty(archivos)}"><li th:each="a : ${archivos}" th:text="${a.formato} + ' · ' + ${a.nombreOriginal}"></li></ul><form class="form-grid" th:action="@{/admin/libros/{id}/archivo(id=${libro.id})}" method="post" enctype="multipart/form-data"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="formato">Formato</label><select id="formato" name="formato"><option>PDF</option><option>EPUB</option><option>MOBI</option></select></div><div class="field"><label for="archivo">Archivo</label><input id="archivo" name="archivo" type="file" accept=".pdf,.epub,.mobi" required></div><div class="actions"><button class="btn secondary" type="submit">Subir archivo</button></div></form></div>
<h2 class="section-title">Otras acciones</h2><div class="panel"><form th:action="@{/admin/libros/{id}/clonar(id=${libro.id})}" method="post" class="actions"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="nuevoTitulo">Titulo de la copia</label><input id="nuevoTitulo" name="titulo" required maxlength="250"></div><button class="btn secondary" type="submit">Clonar ficha</button></form><form th:action="@{/admin/libros/{id}/retirar(id=${libro.id})}" method="post" class="actions"><input th:replace="~{fragments :: csrf}"><button class="btn danger" type="submit">Retirar del catalogo</button></form></div></div></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
