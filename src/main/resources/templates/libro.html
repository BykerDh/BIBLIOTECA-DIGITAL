<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Libro | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="shell page"><a th:href="@{/libros}">← Volver al catalogo</a>
<div class="detail" style="margin-top:18px"><div class="book-cover"><i class="bi bi-book"></i></div><div><span class="eyebrow" th:text="${libro.genero}">Genero</span><h1 th:text="${libro.titulo}">Titulo</h1><p class="meta" th:text="${libro.autor}">Autor</p><span class="pill" th:classappend="${libro.accesoMinimo == 'PREMIUM' ? ' premium' : ''}" th:text="${libro.accesoMinimo}">Plan</span><div class="detail-meta"><span th:text="'Idioma: ' + ${libro.idioma}"></span><span th:if="${libro.paginas}" th:text="${libro.paginas} + ' paginas'"></span><span th:text="'Licencias disponibles: ' + ${disponibles}"></span></div><p class="description" th:text="${libro.descripcion}"></p>
<div class="alert" th:if="${param.prestado}">Prestamo creado. Ya puedes abrir los formatos disponibles.</div><div class="alert" th:if="${param.reservado}">Reserva registrada.</div><div class="alert" th:if="${param.valorado}">Valoracion guardada.</div>
<div class="actions"><form th:action="@{/libros/{id}/prestar(id=${libro.id})}" method="post"><input th:replace="~{fragments :: csrf}"><button class="btn" type="submit" th:disabled="${disponibles == 0}">Solicitar prestamo</button></form><form th:action="@{/libros/{id}/reservar(id=${libro.id})}" method="post"><input th:replace="~{fragments :: csrf}"><button class="btn secondary" type="submit" th:disabled="${disponibles > 0}">Reservar</button></form><a th:if="${usuario.rol == 'ADMIN'}" class="btn secondary" th:href="@{/admin/libros/{id}/editar(id=${libro.id})}">Editar</a></div>
</div></div><h2 class="section-title">Formatos disponibles</h2><div class="panel"><p class="meta" th:if="${#lists.isEmpty(archivos)}">Aun no hay archivos cargados para este libro.</p><ul class="list" th:if="${!#lists.isEmpty(archivos)}"><li class="row-between" th:each="archivo : ${archivos}"><span><strong th:text="${archivo.formato}">PDF</strong> <span class="meta" th:text="${archivo.nombreOriginal}"></span></span><span class="actions" style="margin:0"><a class="btn small secondary" target="_blank" rel="noopener" th:href="@{/libros/{id}/archivo/{formato}(id=${libro.id},formato=${archivo.formato},modo='ONLINE')}">Abrir</a><a class="btn small secondary" th:href="@{/libros/{id}/archivo/{formato}(id=${libro.id},formato=${archivo.formato},modo='DESCARGA')}">Descargar</a></span></li></ul></div>
<h2 class="section-title">Tu valoracion</h2><form class="panel actions" th:action="@{/libros/{id}/valorar(id=${libro.id})}" method="post"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="puntos">Puntuacion</label><select id="puntos" name="puntos"><option th:each="n : ${#numbers.sequence(1,5)}" th:value="${n}" th:text="${n}"></option></select></div><button class="btn secondary" type="submit">Guardar valoracion</button></form></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
