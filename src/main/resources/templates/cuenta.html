<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="shell page"><div class="page-title"><div><h1>Mi cuenta</h1><p th:text="${usuario.nombre} + ' · ' + ${usuario.email}"></p></div><a class="btn secondary" th:href="@{/planes}" th:text="'Plan ' + ${suscripcion.planCodigo}">Plan</a></div>
<div class="alert" th:if="${param.devuelto}">Devolucion registrada.</div><div class="alert" th:if="${param.cancelado}">Reserva cancelada.</div>
<h2 class="section-title">Mis prestamos</h2><div class="panel table-wrap"><table th:if="${!#lists.isEmpty(prestamos)}"><thead><tr><th>Libro</th><th>Inicio</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="p : ${prestamos}"><td><a th:href="@{/libros/{id}(id=${p.libroId})}" th:text="${titulos[p.libroId]}"></a></td><td th:text="${p.prestadoEn}"></td><td th:text="${p.venceEn}"></td><td th:text="${p.devueltoEn == null ? 'Activo' : 'Devuelto'}"></td><td><form th:if="${p.devueltoEn == null}" th:action="@{/prestamos/{id}/devolver(id=${p.id})}" method="post"><input th:replace="~{fragments :: csrf}"><button class="btn small secondary" type="submit">Devolver</button></form></td></tr></tbody></table><p class="empty" th:if="${#lists.isEmpty(prestamos)}">Todavia no tienes prestamos.</p></div>
<h2 class="section-title">Mis reservas</h2><div class="panel table-wrap"><table th:if="${!#lists.isEmpty(reservas)}"><thead><tr><th>Libro</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="r : ${reservas}"><td><a th:href="@{/libros/{id}(id=${r.libroId})}" th:text="${titulos[r.libroId]}"></a></td><td th:text="${r.creadaEn}"></td><td th:text="${r.estado}"></td><td><form th:if="${r.estado == 'PENDIENTE'}" th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post"><input th:replace="~{fragments :: csrf}"><button class="btn small secondary" type="submit">Cancelar</button></form></td></tr></tbody></table><p class="empty" th:if="${#lists.isEmpty(reservas)}">No tienes reservas.</p></div>
<h2 class="section-title">Notificaciones</h2><div class="panel"><ul class="list" th:if="${!#lists.isEmpty(avisos)}"><li class="row-between" th:each="aviso : ${avisos}"><span th:text="${aviso.mensaje}"></span><form th:if="${!aviso.leida}" th:action="@{/notificaciones/{id}/leer(id=${aviso.id})}" method="post"><input th:replace="~{fragments :: csrf}"><button class="btn small secondary" type="submit">Marcar leida</button></form></li></ul><p class="empty" th:if="${#lists.isEmpty(avisos)}">No hay notificaciones.</p></div></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
