<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrones Estructurales | Biblioteca Digital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>
<nav class="navbar biblioteca-navbar">
    <div class="container">
        <a class="navbar-brand" href="/app">Biblioteca Digital</a>
        <a class="navbar-link" href="/app">Inicio</a>
    </div>
</nav>

<main class="container page-shell">
    <header class="page-header">
        <h1>Adapter y Bridge</h1>
        <p>Patrones estructurales aplicados a fuentes y modos de lectura.</p>
    </header>

    <div class="row g-4">
        <div class="col-lg-6">
            <section class="app-card h-100">
                <h2 class="h4">Adapter</h2>
                <p class="text-secondary">
                    Consulta catálogos con interfaces diferentes mediante una interfaz común.
                </p>

                <form method="post" action="/app/estructurales/adapter">
                    <label class="form-label" for="fuente">Fuente del catálogo</label>

                    <select id="fuente" name="fuente" class="form-select mb-3">
                        <option th:each="fuenteItem : ${fuentes}"
                                th:value="${fuenteItem}"
                                th:text="${fuenteItem}">
                        </option>
                    </select>

                    <input type="text" name="titulo" class="form-control mb-3"
                           placeholder="Título a buscar" required>

                    <button type="submit" class="btn btn-library">
                        Consultar catálogo
                    </button>
                </form>

                <div th:if="${resultadoAdapter != null}" class="result-panel">
                    <strong>Resultado de Adapter</strong>
                    <p class="mb-0 mt-2" th:text="${resultadoAdapter.resumen}"></p>
                </div>
            </section>
        </div>

        <div class="col-lg-6">
            <section class="app-card h-100">
                <h2 class="h4">Bridge</h2>
                <p class="text-secondary">
                    Combina el modo de lectura con el formato seleccionado.
                </p>

                <form method="post" action="/app/estructurales/bridge">
                    <input type="text" name="titulo" class="form-control mb-2"
                           placeholder="Título del libro" required>

                    <select name="formato" class="form-select mb-2">
                        <option th:each="formatoItem : ${formatos}"
                                th:value="${formatoItem}"
                                th:text="${formatoItem}">
                        </option>
                    </select>

                    <select name="modo" class="form-select mb-3">
                        <option th:each="modoItem : ${modos}"
                                th:value="${modoItem}"
                                th:text="${modoItem}">
                        </option>
                    </select>

                    <button type="submit" class="btn btn-library">
                        Abrir libro
                    </button>
                </form>

                <div th:if="${resultadoBridge != null}" class="result-panel">
                    <strong>Resultado de Bridge</strong>
                    <p class="mb-0 mt-2" th:text="${resultadoBridge}"></p>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
