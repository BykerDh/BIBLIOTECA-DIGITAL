<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar colecciones | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="shell page"><div class="page-title"><div><h1>Administrar colecciones</h1><p>Organiza libros en colecciones y subcolecciones.</p></div><a class="btn secondary" th:href="@{/colecciones}">Ver arbol</a></div><div class="alert" th:if="${param.creada}">Coleccion creada.</div><div class="alert" th:if="${param.asignado}">Libro agregado a la coleccion.</div><div class="grid two"><section class="panel"><h2>Crear coleccion</h2><form th:action="@{/admin/colecciones}" method="post"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" maxlength="150" required></div><div class="field" style="margin-top:12px"><label for="padreId">Coleccion superior</label><select id="padreId" name="padreId"><option value="">Ninguna</option><option th:each="c : ${colecciones}" th:value="${c.id}" th:text="${c.nombre}"></option></select></div><div class="actions"><button class="btn" type="submit">Crear</button></div></form></section><section class="panel"><h2>Agregar libro</h2><form th:action="@{/admin/colecciones/asignar}" method="post"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="coleccionId">Coleccion</label><select id="coleccionId" name="coleccionId" required><option th:each="c : ${colecciones}" th:value="${c.id}" th:text="${c.nombre}"></option></select></div><div class="field" style="margin-top:12px"><label for="libroId">ID del libro</label><input id="libroId" name="libroId" type="number" min="1" required></div><div class="actions"><button class="btn" type="submit">Agregar</button></div></form></section></div></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
