<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<main class="auth"><div class="auth-card"><a class="brand" th:href="@{/}"><span class="brand-mark">B</span><span>Biblioteca Digital</span></a><h1>Ingresa a tu cuenta</h1><p>Continua con tu correo y contrasena.</p>
<div class="alert error" th:if="${param.error}">Correo o contrasena incorrectos.</div><div class="alert" th:if="${param.registrado}">Cuenta creada. Ya puedes ingresar.</div><div class="alert" th:if="${param.salio}">Sesion cerrada.</div>
<form th:action="@{/login}" method="post"><input th:replace="~{fragments :: csrf}"><div class="field"><label for="username">Correo</label><input id="username" type="email" name="username" autocomplete="username" required></div><div class="field"><label for="password">Contrasena</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="btn" type="submit">Ingresar</button></form>
<p class="bottom">¿No tienes cuenta? <a th:href="@{/registrarse}">Registrate</a></p></div></main></body></html>
