<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Para ti | Biblioteca Digital</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="shell page"><div class="page-title"><div><h1>Para ti</h1><p>Libros relacionados con tus lecturas y preferencias.</p></div></div><form class="panel" th:action="@{/preferencias}" method="post"><input th:replace="~{fragments :: csrf}"><div class="field" style="max-width:350px"><label for="genero">Genero favorito</label><input id="genero" name="genero" th:value="${preferencia}" maxlength="100" required></div><div class="actions"><button class="btn" type="submit">Guardar preferencia</button></div></form><div class="alert" th:if="${param.actualizado}">Preferencia guardada.</div><h2 class="section-title">Recomendaciones</h2><div class="grid" th:if="${!#lists.isEmpty(libros)}"><article class="book-card" th:each="libro : ${libros}"><div class="book-cover blue"><i class="bi bi-book"></i></div><div class="book-body"><span class="eyebrow" th:text="${libro.genero}"></span><h3 th:text="${libro.titulo}"></h3><p th:text="${libro.autor}"></p><a th:href="@{/libros/{id}(id=${libro.id})}">Ver libro</a></div></article></div><p class="empty" th:if="${#lists.isEmpty(libros)}">Todavia no hay libros para recomendar.</p></main><footer th:replace="~{fragments :: pie}"></footer></body></html>
